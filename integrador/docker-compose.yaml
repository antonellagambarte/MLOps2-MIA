# Configuración común a los cuatro contenedores de Airflow. Se define una vez acá
# (&airflow-common) y cada servicio la reusa con "<<: *airflow-common".
x-airflow-common: &airflow-common
  image: apache/airflow:3.0.2
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Coordenadas del resto de la plataforma, para que las usen los DAGs
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    AWS_ENDPOINT_URL_S3: http://minio:9000
    MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_healthy

services:
  # Metadata de la plataforma: MLflow (experimentos, runs, registro de modelos)
  # y Airflow (DAGs, task instances, conexiones) en dos bases lógicas separadas.
  postgres:
    image: postgres:16-alpine
    container_name: integrador_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Afuera 5433 para no chocar con un Postgres instalado en la máquina.
      # Los demás servicios le hablan por postgres:5432, dentro de la red de compose.
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Se ejecuta solo en la primera inicialización, con el volumen vacío.
      - ./dockerfiles/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Data Lake S3: los datos (crudos y procesados) y los artefactos de MLflow
  # (modelos serializados, gráficos).
  minio:
    image: minio/minio:latest
    container_name: integrador_minio
    restart: unless-stopped
    env_file: .env
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"      # API S3: la que usan MLflow, los DAGs y la API
      - "${MINIO_CONSOLE_PORT}:9001"  # consola web, solo para mirar
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Contenedor de un solo uso: crea los buckets y termina. No queda corriendo.
  minio-init:
    image: minio/mc:latest
    container_name: integrador_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_DATA_BUCKET} &&
      mc mb --ignore-existing local/${MINIO_MLFLOW_BUCKET} &&
      echo 'buckets listos';
      "

  # Tracking (qué se entrenó y con qué resultado) + Model Registry (qué versión
  # va a producción). La metadata la escribe en Postgres y los artefactos en MinIO.
  mlflow:
    build: ./dockerfiles/mlflow
    image: integrador/mlflow:local
    container_name: integrador_mlflow
    restart: unless-stopped
    env_file: .env
    environment:
      # Credenciales de MinIO, con los nombres que esperan boto3 y mlflow (hablan S3)
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --default-artifact-root s3://${MINIO_MLFLOW_BUCKET}/
    ports:
      - "${MLFLOW_HOST_PORT}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Un solo uso: crea las tablas de Airflow en la base y el usuario admin.
  airflow-init:
    <<: *airflow-common
    container_name: integrador_airflow_init
    restart: "no"
    user: "0:0"   # root, para poder ajustar los permisos de las carpetas montadas
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

  # La interfaz web y la API REST de Airflow.
  airflow-apiserver:
    <<: *airflow-common
    container_name: integrador_airflow_apiserver
    command: api-server
    restart: unless-stopped
    ports:
      - "${AIRFLOW_HOST_PORT}:8080"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Decide qué tarea corre y cuándo, y con LocalExecutor también las ejecuta.
  airflow-scheduler:
    <<: *airflow-common
    container_name: integrador_airflow_scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Lee los archivos de airflow/dags/ y los convierte en DAGs registrados.
  # En Airflow 3 esto ya no lo hace el scheduler, es un proceso aparte.
  airflow-dag-processor:
    <<: *airflow-common
    container_name: integrador_airflow_dag_processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  minio_data:
